<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ossa e articolazioni, in Basilicata più di quattro ricoveri su dieci sono fuori regione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/radar.css?v=2">
<style>
  [hidden] { display: none !important; }
  .s-tabs { display: flex; gap: 6px; margin: 0 0 18px; }
  .s-tabs a { font: 600 13px var(--sans); color: var(--ink-2); text-decoration: none; padding: 7px 12px; border: 1px solid var(--grey-light); border-radius: 2px; }
  .s-tabs a.is-on { color: var(--bg); background: var(--ink); border-color: var(--ink); }
  .b-lab { font-size: 13px; fill: var(--ink); }
  .b-lab.is-tot { font-weight: 700; }
  .b-tot { font-size: 13px; font-weight: 700; fill: var(--ink); }
  .b-in { font-size: 11px; font-weight: 600; }
  .b-ref { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; }
  .b-ref-t { font-size: 11px; fill: var(--ink-2); }
  .sw--cn { background: var(--red); }
  .sw--sud { background: var(--red-5); }
  .sw--ref { width: 14px; height: 0; border-top: 1.5px dashed var(--ink); border-radius: 0; }
  .f-head { font: 700 20px/1.2 var(--font-title); margin: 36px 0 4px; color: var(--title); }
  .f-sel { margin: 14px 0 0; max-width: 340px; }
  .f-sel label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 0 0 4px; }
  .f-sel select { width: 100%; font: 500 16px/1.2 var(--sans); color: var(--ink); background: var(--tip-bg);
    border: 1px solid var(--grey-light); border-radius: 2px; padding: 10px 32px 10px 12px; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .f-sel select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .f-lab { font-size: 12px; fill: var(--ink); }
  .f-lab .v { fill: var(--ink-2); }
  .f-src { font-size: 13px; font-weight: 700; fill: var(--ink); }
  .is-sel .b-lab { font-weight: 700; }
  .hit { cursor: pointer; }
</style>
</head>
<body>
<main class="radar" id="app">
  <header>
    <h1 class="r-title" id="tit"></h1>
    <p class="r-sub" id="sub"></p>
  </header>

  <section class="r-chart">
    <div class="r-key" style="margin:0 0 12px">
      <span><i class="sw sw--cn"></i>Verso il Centro-Nord</span>
      <span><i class="sw sw--sud"></i>Verso altre regioni del Sud</span>
      <span><i class="sw sw--ref"></i>Media delle regioni del Centro-Nord</span>
    </div>
    <div id="bars"></div>
    <p class="r-note" id="note"></p>
  </section>

  <h2 class="f-head" id="fHead"></h2>
  <p class="r-sub" id="fSub"></p>
  <div class="f-sel"><label for="fSel">Regione di residenza</label><select id="fSel"></select></div>
  <section class="r-chart" style="margin-top:16px">
    <div id="fan"></div>
  </section>

  <footer class="r-foot">
    <span id="fonte"></span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
<script src="../assets/radar.js?v=2"></script>
<script>
(function () {
  var P = {
    "oncologia": { t: "In Molise e Calabria più di un ricovero oncologico su due avviene fuori regione",
      s: "Quota dei ricoveri in area oncologica dei residenti nelle regioni del Mezzogiorno avvenuti in un'altra regione, per area di destinazione, 2024",
      tab: "Tab. 3", csv: "../data/oncologia-flussi.csv", cosa: "ricoveri oncologici" },
    "muscolo-scheletrico": { t: "Ossa e articolazioni, in Basilicata più di quattro ricoveri su dieci sono fuori regione",
      s: "Quota dei ricoveri per l'apparato muscolo-scheletrico dei residenti nelle regioni del Mezzogiorno avvenuti in un'altra regione, per area di destinazione, 2024",
      tab: "Tab. 5", csv: "../data/muscolo-scheletrico-flussi.csv", cosa: "ricoveri per l'apparato muscolo-scheletrico" }
  };
  var k = "muscolo-scheletrico";
  var c = P[k];
  document.getElementById("tit").textContent = c.t;
  document.getElementById("sub").textContent = c.s;
  document.getElementById("fonte").textContent = "Fonte: elaborazione su dati Svimez, Rapporto 2026, cap. 16, " + c.tab + ", su dati Agenas";

  var SUD = ["Abruzzo", "Molise", "Campania", "Puglia", "Basilicata", "Calabria", "Sicilia", "Sardegna"];
  var DA = { "Molise": "dal Molise", "Abruzzo": "dall'Abruzzo" };
  var box = document.getElementById("bars");
  var tip = Radar.tooltip(box);
  Radar.dismissOutside(box, tip.hide);
  var fmt = function (v) { return Radar.fmt(v, 0); };
  var p1 = function (v) { return Radar.fmt(v * 100, 1) + "%"; };

  Radar.loadCSV(c.csv).then(function (rows) {
    var R = {};
    rows.forEach(function (d) {
      var o = d.provenienza, t = d.destinazione, v = Radar.num(d.ricoveri) || 0;
      if (!R[o]) R[o] = { r: o, tot: 0, dentro: 0, cn: 0, sud: 0, dest: {} };
      R[o].tot += v;
      if (o === t) R[o].dentro += v;
      else { if (SUD.indexOf(t) >= 0) R[o].sud += v; else R[o].cn += v; R[o].dest[t] = v; }
    });
    // media delle regioni del Centro-Nord (fuga su ricoveri dei residenti)
    var cnF = 0, cnT = 0;
    Object.keys(R).forEach(function (r) { if (SUD.indexOf(r) < 0) { cnF += R[r].cn + R[r].sud; cnT += R[r].tot; } });
    var ref = cnF / cnT;
    // riga di sintesi del Mezzogiorno
    var M = { r: "Mezzogiorno", tot: 0, dentro: 0, cn: 0, sud: 0, dest: {}, isTot: true };
    SUD.forEach(function (r) { var x = R[r]; M.tot += x.tot; M.dentro += x.dentro; M.cn += x.cn; M.sud += x.sud;
      Object.keys(x.dest).forEach(function (d) { if (SUD.indexOf(d) < 0) M.dest[d] = (M.dest[d] || 0) + x.dest[d]; }); });
    var data = SUD.map(function (r) { return R[r]; });
    data.forEach(function (d) { d.q = (d.cn + d.sud) / d.tot; });
    M.q = (M.cn + M.sud) / M.tot;
    data.sort(function (a, b) { return b.q - a.q; });
    data.push(M);

    document.getElementById("note").innerHTML = "La quota è calcolata sul totale dei ricoveri dei residenti, nella propria regione e fuori. " +
      "Per il Mezzogiorno nel suo insieme gli spostamenti tra regioni del Sud contano come fuga. " +
      "La media del Centro-Nord (" + p1(ref) + ") è la quota di ricoveri fuori regione dei residenti nelle regioni del Centro e del Nord. " +
      "Le destinazioni dei singoli flussi sono stime Svimez. Passa sulle barre per il dettaglio, toccale per vedere sotto dove vanno i pazienti";

    var sel = document.getElementById("fSel");
    function draw(width, phase) {
      d3.select(box).select("svg").remove();
      var narrow = Radar.isNarrow(width);
      var labW = narrow ? 94 : 110, totW = 46, rowH = narrow ? 30 : 34, barH = narrow ? 18 : 20, gap = 14;
      var h = data.length * rowH + gap + 26;
      var x = d3.scaleLinear().domain([0, Math.max(0.6, d3.max(data, function (d) { return d.q; }))]).range([labW, width - totW]);
      var svg = d3.select(box).append("svg").attr("width", width).attr("height", h)
        .attr("role", "img").attr("aria-label", "Quota di " + c.cosa + " fuori regione per regione del Mezzogiorno");
      var yOf = function (i) { return 22 + i * rowH + (i === data.length - 1 ? gap : 0); };
      // griglia e assi
      var ticks = x.ticks(narrow ? 3 : 6);
      svg.append("g").attr("class", "grid").selectAll("line").data(ticks).join("line")
        .attr("x1", x).attr("x2", x).attr("y1", 14).attr("y2", h - 4);
      svg.append("g").selectAll("text").data(ticks).join("text").attr("class", "tick-label")
        .attr("x", x).attr("y", 10).attr("text-anchor", "middle").text(function (v) { return Radar.fmt(v * 100, 0) + "%"; });
      // separatore prima della riga Mezzogiorno
      svg.append("line").attr("x1", 0).attr("x2", width).attr("y1", yOf(data.length - 1) - gap / 2 - 2).attr("y2", yOf(data.length - 1) - gap / 2 - 2)
        .style("stroke", "var(--rule)");

      var g = svg.append("g").selectAll("g").data(data).join("g").attr("transform", function (d, i) { return "translate(0," + yOf(i) + ")"; });
      g.append("text").attr("class", function (d) { return "b-lab" + (d.isTot ? " is-tot" : ""); })
        .attr("x", 0).attr("y", barH / 2).attr("dy", "0.35em").text(function (d) { return d.r; });
      var segCn = g.append("rect").attr("class", "mark").attr("y", 0).attr("height", barH).attr("x", x(0)).style("fill", "var(--red)");
      var segSud = g.append("rect").attr("class", "mark").attr("y", 0).attr("height", barH).style("fill", "var(--red-5)");
      var tot = g.append("text").attr("class", "b-tot").attr("y", barH / 2).attr("dy", "0.35em").text(function (d) { return Radar.fmt(d.q * 100, 1) + "%"; });
      Radar.enter(segCn, phase, function (s) { s.attr("width", 0); }, function (s) { s.attr("width", function (d) { return x(d.cn / d.tot) - x(0); }); });
      Radar.enter(segSud, phase, function (s) { s.attr("x", x(0)).attr("width", 0); },
        function (s) { s.attr("x", function (d) { return x(d.cn / d.tot); }).attr("width", function (d) { return x(d.q) - x(d.cn / d.tot); }); });
      Radar.enter(tot, phase, function (s) { s.attr("x", x(0) + 6).attr("opacity", 0); }, function (s) { s.attr("x", function (d) { return x(d.q) + 6; }).attr("opacity", 1); });
      // valori dentro le barre se c'è spazio
      g.append("text").attr("class", "b-in").attr("y", barH / 2).attr("dy", "0.35em")
        .attr("x", function (d) { return x(0) + 5; }).style("fill", "#fff")
        .text(function (d) { return x(d.cn / d.tot) - x(0) > 34 ? Radar.fmt(d.cn / d.tot * 100, 0) + "%" : ""; });
      g.append("text").attr("class", "b-in").attr("y", barH / 2).attr("dy", "0.35em")
        .attr("x", function (d) { return x(d.cn / d.tot) + 5; }).style("fill", "var(--red-1)")
        .text(function (d) { return x(d.q) - x(d.cn / d.tot) > 34 ? Radar.fmt(d.sud / d.tot * 100, 0) + "%" : ""; });
      // media Centro-Nord
      svg.append("line").attr("class", "b-ref").attr("x1", x(ref)).attr("x2", x(ref)).attr("y1", 16).attr("y2", h - 4);
      // interazione
      g.append("rect").attr("class", "hit").attr("x", 0).attr("y", -(rowH - barH) / 2).attr("width", width).attr("height", rowH)
        .on("pointerenter pointermove", function (ev, d) {
          g.selectAll(".mark").classed("is-dimmed", function (x) { return x !== d; });
          var top = Object.keys(d.dest).filter(function (t) { return SUD.indexOf(t) < 0; })
            .sort(function (a, b) { return d.dest[b] - d.dest[a]; })[0];
          var p = d3.pointer(ev, box);
          tip.show(Radar.tipHTML({
            title: d.r, value: Radar.fmt(d.q * 100, 1) + "%", unit: "fuori regione",
            rows: [["Centro-Nord", p1(d.cn / d.tot) + " · " + fmt(d.cn)],
                   [d.isTot ? "Tra regioni del Sud" : "Altre regioni del Sud", p1(d.sud / d.tot) + " · " + fmt(d.sud)],
                   ["Ricoveri in regione", fmt(d.dentro)]],
            note: top ? "Prima destinazione al Centro-Nord: " + top + " (" + fmt(d.dest[top]) + ")" : ""
          }), p[0], p[1]);
        })
        .on("pointerleave", function () { g.selectAll(".mark").classed("is-dimmed", false); tip.hide(); })
        .on("click", function (ev, d) { tip.hide(); sel.value = d.r; drawFan(); });
      g.classed("is-sel", function (d) { return d.r === sel.value; });
    }
    Radar.responsive(box, draw);

    // ---------- ventaglio: dove vanno i pazienti della regione scelta ----------
    // classifica delle 21 regioni per quota di ricoveri fuori regione sul totale dei ricoveri dei residenti
    var RANK = {};
    var quota = function (r) { return (R[r].cn + R[r].sud) / R[r].tot; };
    Object.keys(R).sort(function (a, b) { return quota(b) - quota(a); })
      .forEach(function (r, i) { RANK[r] = i + 1; });
    var byName = function (a, b) { return a.localeCompare(b, "it"); };
    var opt = function (r) { return '<option>' + r + '</option>'; };
    sel.innerHTML = '<option value="Mezzogiorno">Tutto il Mezzogiorno</option>' +
      '<optgroup label="Mezzogiorno">' + SUD.slice().sort(byName).map(opt).join("") + '</optgroup>' +
      '<optgroup label="Centro-Nord">' + Object.keys(R).filter(function (r) { return SUD.indexOf(r) < 0; }).sort(byName).map(opt).join("") + '</optgroup>';
    var SHORT = { "Friuli-Venezia Giulia": "Friuli-V.G.", "Emilia-Romagna": "Emilia-R.", "Valle d'Aosta": "V. d'Aosta",
      "P.A. Bolzano": "Bolzano", "P.A. Trento": "Trento", "Mezzogiorno": "Mezzog." };
    // destinazioni fisse: le 5 principali del Mezzogiorno al Centro-Nord, poi i due gruppi
    var DEST = Object.keys(M.dest).sort(function (a, b) { return M.dest[b] - M.dest[a]; }).slice(0, 5);
    var ALTRE_CN = "Altre regioni del Centro-Nord", ALTRE_SUD = c.altreSud || "Altre regioni del Sud";
    var ORD = DEST.concat([ALTRE_CN, ALTRE_SUD]);
    document.getElementById("fHead").textContent = "Dove vanno a curarsi";
    document.getElementById("fSub").textContent = "Ricoveri fuori regione per destinazione, 2024. Le destinazioni sono le stesse per tutte le regioni (le cinque del Centro-Nord che ricevono più pazienti dal Mezzogiorno e due gruppi per tutte le altre), in ordine decrescente";
    var fanBox = document.getElementById("fan");
    var tip2 = Radar.tooltip(fanBox);
    Radar.dismissOutside(fanBox, tip2.hide);
    function flows(r) {
      var src = r === "Mezzogiorno" ? M : R[r], out = {};
      ORD.forEach(function (k) { out[k] = 0; });
      if (r === "Mezzogiorno") {
        Object.keys(M.dest).forEach(function (t) { out[DEST.indexOf(t) >= 0 ? t : ALTRE_CN] += M.dest[t]; });
        out[ALTRE_SUD] = M.sud;
      } else {
        Object.keys(src.dest).forEach(function (t) {
          var k = SUD.indexOf(t) >= 0 ? ALTRE_SUD : DEST.indexOf(t) >= 0 ? t : ALTRE_CN;
          out[k] += src.dest[t];
        });
      }
      return { src: src, out: out };
    }
    function drawFan(phase) {
      var width = Math.floor(fanBox.getBoundingClientRect().width); if (!width) return;
      d3.select(box).selectAll("g").classed("is-sel", function (d) { return d && d.r === sel.value; });
      d3.select(fanBox).select("svg").remove();
      var narrow = Radar.isNarrow(width);
      var F = flows(sel.value), tot = d3.sum(ORD, function (k) { return F.out[k]; });
      var nodes = [{ id: "src", nome: sel.value }], links = [];
      ORD.forEach(function (k) { if (F.out[k] > 0) { nodes.push({ id: k, nome: k }); links.push({ source: "src", target: k, value: F.out[k] }); } });
      var H = narrow ? 300 : 330, labL = narrow ? 92 : 160, labR = narrow ? 128 : 270;
      var sk = d3.sankey().nodeId(function (d) { return d.id; }).nodeWidth(narrow ? 8 : 10).nodePadding(narrow ? 14 : 16)
        .nodeSort(function (a, b) { return a.id === "src" || b.id === "src" ? 0 : b.value - a.value || ORD.indexOf(a.id) - ORD.indexOf(b.id); })
        .extent([[labL, 4], [width - labR, H - 4]]);
      var gr = sk({ nodes: nodes, links: links });
      var colOf = function (k) { return k === ALTRE_SUD ? "var(--red-5)" : "var(--red)"; };
      var svg = d3.select(fanBox).append("svg").attr("width", width).attr("height", H)
        .attr("role", "img").attr("aria-label", "Destinazioni dei " + c.cosa + " fuori regione di " + sel.value);
      var lk = svg.append("g").selectAll("path").data(gr.links).join("path").attr("class", "mark")
        .attr("d", d3.sankeyLinkHorizontal()).attr("fill", "none")
        .style("stroke", function (d) { return colOf(d.target.id); })
        .attr("stroke-width", function (d) { return Math.max(1, d.width); });
      Radar.enter(lk, phase || "static", function (s) { s.attr("stroke-opacity", 0); }, function (s) { s.attr("stroke-opacity", 0.55); });
      svg.append("g").selectAll("rect").data(gr.nodes).join("rect")
        .attr("x", function (d) { return d.x0; }).attr("y", function (d) { return d.y0; })
        .attr("width", function (d) { return d.x1 - d.x0; }).attr("height", function (d) { return Math.max(1, d.y1 - d.y0); })
        .style("fill", function (d) { return d.id === "src" ? "var(--ink)" : colOf(d.id); });
      var src = gr.nodes[0];
      var st = svg.append("text").attr("class", "f-src").attr("x", src.x0 - 8).attr("y", (src.y0 + src.y1) / 2).attr("text-anchor", "end");
      st.append("tspan").attr("x", src.x0 - 8).attr("dy", "-0.2em").text(narrow ? (SHORT[sel.value] || sel.value) : sel.value);
      st.append("tspan").attr("x", src.x0 - 8).attr("dy", "1.3em").attr("font-weight", 400).style("fill", "var(--ink-2)").text(fmt(tot));
      if (RANK[sel.value]) {
        st.attr("y", (src.y0 + src.y1) / 2 - 8);
        st.append("tspan").attr("x", src.x0 - 8).attr("dy", "1.3em").attr("font-weight", 600).style("fill", "var(--ink)")
          .text(RANK[sel.value] + "ª su 21");
        st.append("tspan").attr("x", src.x0 - 8).attr("dy", "1.2em").attr("font-weight", 400).style("fill", "var(--ink-2)")
          .style("font-size", "11px").text(Radar.fmt(quota(sel.value) * 100, 1) + (narrow ? "%" : "% fuori regione"));
      }
      var daSud = sel.value === "Mezzogiorno" || SUD.indexOf(sel.value) >= 0;
      var short = { "Altre regioni del Centro-Nord": narrow ? "Altre Centro-Nord" : "Altre regioni del Centro-Nord",
        "Altre regioni del Sud": daSud ? (narrow ? "Altre Sud" : "Altre regioni del Sud") : (narrow ? "Mezzogiorno" : "Regioni del Mezzogiorno"),
        "Emilia-Romagna": narrow ? "Emilia-R." : "Emilia-Romagna" };
      var nomeLungo = function (k) { return k === ALTRE_SUD && !daSud ? "Regioni del Mezzogiorno" : k; };
      var lt = svg.append("g").selectAll("text").data(gr.nodes.slice(1)).join("text").attr("class", "f-lab")
        .attr("x", function (d) { return d.x1 + 6; }).attr("y", function (d) { return (d.y0 + d.y1) / 2; }).attr("dy", "0.35em");
      lt.append("tspan").attr("font-weight", 600).text(function (d) { return short[d.id] || d.id; });
      lt.append("tspan").attr("class", "v").text(function (d) { return " " + (narrow ? "" : fmt(d.value) + " · ") + Radar.fmt(d.value / tot * 100, 0) + "%"; });
      lk.on("pointerenter pointermove", function (ev, d) {
          lk.attr("stroke-opacity", function (x) { return x === d ? 0.85 : 0.15; });
          var p = d3.pointer(ev, fanBox);
          tip2.show(Radar.tipHTML({ title: sel.value + " → " + nomeLungo(d.target.id), value: fmt(d.value), unit: "ricoveri",
            rows: [["Sul totale dei ricoveri fuori regione", Radar.fmt(d.value / tot * 100, 1) + "%"]] }), p[0], p[1]);
        }).on("pointerleave", function () { lk.attr("stroke-opacity", 0.55); tip2.hide(); });
      Radar.scheduleHeight();
    }
    sel.addEventListener("change", function () { drawFan(); });
    Radar.responsive(fanBox, function (w, phase) { drawFan(phase); });
  }).catch(function (e) { Radar.fail(document.getElementById("app"), e); });
})();
</script>
</body>
</html>
